name: onlycars

# Compose local/directo. Producción detrás de Nginx Proxy Manager usa compose.npm.yaml.
services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_DATABASE: ${DB_NAME:-onlycars}
      MARIADB_USER: ${DB_USER:-onlycars}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en el archivo de entorno}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Definir DB_ROOT_PASSWORD en el archivo de entorno}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    command: ["--log-bin=mysql-bin", "--binlog-format=ROW", "--expire-logs-days=7", "--server-id=1"]
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging:
      options: { max-size: "10m", max-file: "3" }

  database-init:
    build:
      context: .
      target: database-init
    environment:
      DATABASE_URL: mysql://${DB_USER:-onlycars}:${DB_PASSWORD}@db:3306/${DB_NAME:-onlycars}
      PLATFORM_HOST: ${PLATFORM_HOST:-onlycars.nanoapps.ar}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-nanoapps.ar}
      BASE_DOMAIN: ${PLATFORM_HOST:-onlycars.nanoapps.ar}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-desa@nanolabs.com.ar}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-}
      SEED_DEMO_ADMIN_EMAIL: ${SEED_DEMO_ADMIN_EMAIL:-admin@carshop.com}
      SEED_DEMO_ADMIN_PASSWORD: ${SEED_DEMO_ADMIN_PASSWORD:-}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: mysql://${DB_USER:-onlycars}:${DB_PASSWORD}@db:3306/${DB_NAME:-onlycars}
      PLATFORM_HOST: ${PLATFORM_HOST:-onlycars.nanoapps.ar}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-nanoapps.ar}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    depends_on:
      db: { condition: service_healthy }
      database-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      options: { max-size: "10m", max-file: "3" }

volumes:
  mariadb_data:
